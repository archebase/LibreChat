version: 1.2.8
cache: true

interface:
  modelSelect: true
  memories: true
  agents:
    use: true
    create: true
    share: false
    public: false
  customWelcome: "欢迎使用 ArcheBase AI 助手"

modelSpecs:
  prioritize: true
  addedEndpoints: ["agents"]
  list:
    - name: "ArcheBase"
      label: "ArcheBase"
      default: true
      iconURL: "${DOMAIN_SERVER}/images/icon-square.png"
      preset:
        endpoint: "agents"
        agent_id: "agent_replace_with_archebase_agent_id"
        model: "deepseek-v4-pro"
        modelLabel: "ArcheBase"
        iconURL: "${DOMAIN_SERVER}/images/icon-square.png"

endpoints:
  agents:
    disableBuilder: false
    allowedProviders: ["ArcheBase"]
    capabilities: ["actions", "tools", "chain"]
  custom:
    - name: "ArcheBase"
      apiKey: "impersonator-sidecar"
      baseURL: "http://impersonator:8080/v1"
      headers:
        X-AIFlow-Impersonate-Sub: "{{LIBRECHAT_USER_OPENIDID}}"
      models:
        fetch: true
        default: ["deepseek-v4-pro", "deepseek-v4-flash"]
      titleConvo: true
      titleModel: "deepseek-v4-flash"
      modelDisplayLabel: "ArcheBase"
      iconURL: "${DOMAIN_SERVER}/images/icon-square.png"

memory:
  disabled: false
  personalize: true
  tokenLimit: 10000
  charLimit: 10000
  messageWindowSize: 5
  validKeys: ["preferences", "work_info", "personal_info", "skills", "interests", "context"]
  agent:
    enabled: true
    provider: "ArcheBase"
    model: "deepseek-v4-flash"
    model_parameters:
      temperature: 0.1
